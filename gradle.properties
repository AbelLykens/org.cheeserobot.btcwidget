org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Keep the standalone Kotlin Android plugin in charge. AGP 9's "built-in
# Kotlin" support (the new default `true`) tries to register a second
# `kotlin` extension and collides with id("org.jetbrains.kotlin.android"),
# so we explicitly opt out. This will be removed once we migrate the
# build script to use AGP 9's built-in Kotlin DSL instead of the plugin.
android.builtInKotlin=false

# Suppresses an AGP 9 hint about a flag that only matters for very
# large multi-module projects. We're a single-module app — no benefit
# from enabling it, and the hint is just noise on every build.
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
